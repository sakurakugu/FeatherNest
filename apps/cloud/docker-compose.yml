name: feathernest

services:
  # ── PostgreSQL ────────────────────────────────────────
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # PostgreSQL 18 起官方镜像建议挂载到 /var/lib/postgresql
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────
  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (兼容 S3 的文件存储) ────────────────
  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --address ":9002" --console-address ":9001" --certs-dir /certs
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      # 仅 TLS 端口使用证书；明文 9000 继续服务内部 backend
      MINIO_SKIP_TLS_PLAINTEXT: "on"
      MINIO_PUBLIC_IPS: "127.0.0.1"
      MINIO_BROWSER_REDIRECT_URL: "https://s3.sakurakugu.com/console"
    volumes:
      - miniodata:/data
      - ./minio-certs:/certs:ro
    ports:
      - "127.0.0.1:9000:9000" # MinIO API 端口（明文，供内部 backend 使用）
      - "127.0.0.1:9002:9002" # MinIO API 端口（TLS，供 magpie 同步使用）
      - "127.0.0.1:9001:9001" # MinIO 控制台端口
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:9002/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── 后端 (FastAPI) ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9002
      MINIO_USE_SSL: "true"
      # 让 Python requests/urllib3 信任 MinIO 自签证书
      REQUESTS_CA_BUNDLE: /certs/public.crt
      SSL_CERT_FILE: /certs/public.crt
      APP_TIMEZONE: Asia/Shanghai
    volumes:
      - ./minio-certs/public.crt:/certs/public.crt:ro
      - ../blog/public/banner:/app/banner:ro
      - twikoodata:/app/twikoo-data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── Twikoo（评论服务） ─────────────────────────────
  twikoo:
    image: imaegoo/twikoo
    restart: unless-stopped
    environment:
      TWIKOO_THROTTLE: 250
      TZ: Asia/Shanghai
    volumes:
      - twikoodata:/app/data
    ports:
      - "127.0.0.1:8001:8080"

  # ── 前端 (Vue 3 - 容器内通过 nginx 托管静态文件) ────
  frontend:
    build:
      context: ../..
      dockerfile: apps/cloud/Dockerfile
      args:
        SSG_API_BASE_URL: ${SSG_API_BASE_URL:-https://www.sakurakugu.com/api/v1}
        SITE_URL: ${SITE_URL:-https://www.sakurakugu.com}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"

  # ── Caddy (反向代理 + 自动 HTTPS 证书) ──────────────────────
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - backend
      - frontend
      - twikoo
    networks:
      - default
      - couchdb_proxy
      - qinglong_proxy

volumes:
  pgdata:
  redisdata:
  miniodata:
  twikoodata:
  caddydata:
  caddyconfig:

networks:
  couchdb_proxy:
    external: true
  qinglong_proxy:
    external: true
